<div class="sidebar">

  <div>

    <div class="logo">
      <h2>Panel Admin</h2>
      <span>{{ perfil }}</span>
    </div>

    <ul class="menu">

      @for(modulo of modulos; track modulo.nombre){

        <li class="menu-item">

          <a
            [routerLink]="modulo.ruta"
            routerLinkActive="activo"
          >

            <i [class]="modulo.icono"></i>

            <span>
              {{ modulo.nombre }}
            </span>

          </a>

        </li>

      }

    </ul>

  </div>

 <div class="sidebar-footer">

  <button
    class="logout-btn"
    (click)="cerrarSesion()"
  >

    <i class="fi fi-rr-sign-out-alt"></i>

    <span>
      Cerrar sesión
    </span>

  </button>

</div>

</div>
