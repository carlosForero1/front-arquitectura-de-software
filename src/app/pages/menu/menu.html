<div class="sidebar">

  <div class="logo">
    <h2>Panel Admin</h2>
    <span>{{ perfil }}</span>
  </div>

  <ul class="menu">

    @for(modulo of modulos; track modulo.nombre){

      <li class="menu-item">

        <a
          [routerLink]="modulo.ruta"
          routerLinkActive="activo"
        >

          <i [class]="modulo.icono"></i>

          <span>
            {{ modulo.nombre }}
          </span>

        </a>

      </li>

    }

  </ul>

</div>
