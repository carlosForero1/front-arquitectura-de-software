<div class="login-section">

    <div class="container">

        <div class="row justify-content-center align-items-center">

            <div class="col-lg-7 col-md-10">

                <div class="login-card">

                    <div class="text-center mb-4">

                        <div class="logo-circle">
                            🛡️
                        </div>

                        <h2 class="fw-bold mt-3">

                            Crear Cuenta

                        </h2>

                        <p class="text-muted">

                            Registra un nuevo usuario para AI Security Agent

                        </p>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Nombre completo

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                [(ngModel)]="usuario.nombre"
                                placeholder="Carlos Quintero">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Cargo

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                [(ngModel)]="usuario.cargo"
                                placeholder="Analista de Seguridad">

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Correo electrónico

                        </label>

                        <input
                            type="email"
                            class="form-control"
                            [(ngModel)]="usuario.correo"
                            placeholder="usuario@empresa.com">

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Usuario

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                [(ngModel)]="usuario.usuario"
                                placeholder="cquintero">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Contraseña

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                [(ngModel)]="usuario.contrasena"
                                placeholder="********">

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Perfil

                        </label>

                        <select
                            class="form-select"
                            [(ngModel)]="usuario.perfilId">

                            <option [ngValue]="null">

                                Seleccione un perfil

                            </option>

                            <option
                                *ngFor="let perfil of perfiles"
                                [value]="perfil.id">

                                {{ perfil.nombre }}

                            </option>

                        </select>

                    </div>

                    <div
                        class="alert alert-danger"
                        *ngIf="error">

                        {{ error }}

                    </div>

                    <div
                        class="alert alert-success"
                        *ngIf="mensaje">

                        {{ mensaje }}

                    </div>

                    <button
                        class="btn btn-success w-100 mb-3"
                        (click)="registrar()"
                        [disabled]="cargando">

                        {{ cargando ? 'Registrando...' : 'Crear Cuenta' }}

                    </button>

                    <div class="text-center">

                        <p class="text-muted mb-2">

                            ¿Ya tienes una cuenta?

                        </p>

                        <a
                            routerLink="/login"
                            class="btn btn-outline-primary w-100">

                            Iniciar Sesión

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
